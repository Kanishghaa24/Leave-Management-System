
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container dashboard">
        <h1>Leave Management System</h1>

        <section>
            <h2>Leave Balance</h2>
            <p>Welcome, <strong id="username"></strong></p>
            <p>Roll Number: <strong id="rollNumber"></strong></p>
            <p>Casual Leave: <strong id="casualBalance"></strong></p>
            <p>Medical Leave: <strong id="medicalBalance"></strong></p>

            <button type="button" id="refreshButton">Refresh Balance</button>
            <button type="button" id="logoutButton">Logout</button>
        </section>

        <section>
            <h2>Apply for Leave</h2>

            <form id="leaveForm">
                <label for="leaveType">Leave Type:</label>
                <select id="leaveType" required>
                    <option value="Casual">Casual</option>
                    <option value="Medical">Medical</option>
                </select>

                <label for="days">Number of Days:</label>
                <input id="days" type="number" min="1" step="1"
                       value="1" required>

                <button type="submit">Apply Leave</button>
            </form>
        </section>

        <p id="message" role="status"></p>
    </main>

    <script>
        const userId = sessionStorage.getItem("leaveUserId");
        const message = document.getElementById("message");

        if (!userId) {
            window.location.replace("/");
        }

        async function loadBalance() {
            try {
                const response = await fetch(`/api/leaves/balance/${userId}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.message);

                document.getElementById("username").textContent = data.username;
                document.getElementById("rollNumber").textContent = data.rollNumber;
                document.getElementById("casualBalance").textContent = data.casualLeave;
                document.getElementById("medicalBalance").textContent = data.medicalLeave;
                message.textContent = "";
            } catch (error) {
                message.textContent = error.message;
            }
        }

        document.getElementById("refreshButton").addEventListener("click", loadBalance);

        document.getElementById("logoutButton").addEventListener("click", () => {
            sessionStorage.removeItem("leaveUserId");
            window.location.replace("/");
        });

        document.getElementById("leaveForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            try {
                const response = await fetch(`/api/leaves/apply/${userId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        leaveType: document.getElementById("leaveType").value,
                        days: Number(document.getElementById("days").value)
                    })
                });

                const data = await response.json();
                message.textContent = data.message;

                if (response.ok) {
                    document.getElementById("days").value = 1;
                    await loadBalance();
                    message.textContent = data.message;
                }
            } catch (error) {
                message.textContent = "Could not apply for leave. Try again.";
            }
        });

        loadBalance();
    </script>
</body>
</html>
