<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container dashboard">

        <h1>Leave Management System</h1>

        <section>
            <h2>Leave Balance</h2>

            <p>Welcome, <strong id="username"></strong></p>
            <p>Roll Number: <strong id="rollNumber"></strong></p>
            <p>Casual Leave: <strong id="casualBalance"></strong></p>
            <p>Medical Leave: <strong id="medicalBalance"></strong></p>

            <button type="button" id="refreshButton">
                Refresh Balance
            </button>

            <button type="button" id="logoutButton">
                Logout
            </button>
        </section>

        <section>
            <h2>Apply for Leave</h2>

            <form id="leaveForm">

                <label for="leaveType">Leave Type:</label>

                <select id="leaveType" required>
                    <option value="Casual">Casual</option>
                    <option value="Medical">Medical</option>
                </select>

                <label for="days">Number of Days:</label>

                <input
                    id="days"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                    required
                >

                <button type="submit" id="applyButton">
                    Apply Leave
                </button>

            </form>
        </section>

        <p id="message" role="status"></p>

    </main>

    <script>
        // BACKEND API
        // Frontend and backend are hosted on the same Render service.
        const API_URL = "";

        // GET USER ID
        const userId = sessionStorage.getItem("leaveUserId");

        const message = document.getElementById("message");
        const applyButton = document.getElementById("applyButton");

        // CHECK LOGIN
        if (!userId) {
            window.location.replace("/");
        }

        // LOAD LEAVE BALANCE
        async function loadBalance() {

            try {

                message.textContent = "Loading leave balance...";

                const response = await fetch(
                    `${API_URL}/api/leaves/balance/${encodeURIComponent(userId)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Unable to load balance");
                }

                document.getElementById("username").textContent =
                    data.username;

                document.getElementById("rollNumber").textContent =
                    data.rollNumber;

                document.getElementById("casualBalance").textContent =
                    data.casualLeave;

                document.getElementById("medicalBalance").textContent =
                    data.medicalLeave;

                message.textContent = "";

            } catch (error) {

                console.error("Balance error:", error);

                message.textContent =
                    error.message || "Could not connect to server.";

            }
        }

        // REFRESH BALANCE
        document
            .getElementById("refreshButton")
            .addEventListener("click", loadBalance);

        // LOGOUT
        document
            .getElementById("logoutButton")
            .addEventListener("click", () => {

                sessionStorage.removeItem("leaveUserId");

                window.location.replace("/");

            });

        // APPLY FOR LEAVE
        document
            .getElementById("leaveForm")
            .addEventListener("submit", async (event) => {

                event.preventDefault();

                const leaveType =
                    document.getElementById("leaveType").value;

                const days = Number(
                    document.getElementById("days").value
                );

                if (!Number.isInteger(days) || days < 1) {

                    message.textContent =
                        "Please enter a valid number of days.";

                    return;
                }
