<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>
<body>

    <main class="container">

        <h1>Leave Management System</h1>

        <!-- REGISTER SECTION -->
        <section id="registerSection">
            <h2>Create User</h2>

            <form id="registerForm">

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="rollNumber">Roll Number:</label>
                <input type="text" id="rollNumber" name="rollNumber" required>

                <label for="casualLeave">Initial Casual Leave:</label>
                <input type="number" id="casualLeave"
                    name="casualLeave" min="0" value="1" required>

                <label for="medicalLeave">Initial Medical Leave:</label>
                <input type="number" id="medicalLeave"
                    name="medicalLeave" min="0" value="2" required>

                <button type="submit" id="registerButton">Register</button>

            </form>

            <p>
                Already have an account?
                <a href="#" id="showLogin">Login</a>
            </p>
        </section>

        <!-- LOGIN SECTION -->
        <section id="loginSection" hidden>

            <h2>Login</h2>

            <form id="loginForm">

                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" required>

                <button type="submit" id="loginButton">Login</button>

            </form>

            <p>
                <a href="#" id="showRegister">Create a new account</a>
            </p>

        </section>

        <p id="message" role="status"></p>

    </main>

</body>
</html>
